[project]
name = "fr-lore-index"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick Yelton", email = "nicholasyelton@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.6",
    "pydantic>=2.13.5",
    "tenacity>=9.1.4",
]

[project.scripts]
fr-lore-index = "fr_lore_index:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
